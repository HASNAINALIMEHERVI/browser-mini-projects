<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tables Book (1–100)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    /* ====== Base Layout ====== */
    :root {
      --page-width: min(900px, 92vw); /* total book width */
      --page-height: min(650px, 82vh); /* total book height */
      --card-radius: 14px; /* card border radius - adjust here */
      --shadow: 0 8px 20px rgba(0,0,0,.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(90deg, #000 50%,#fff);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* ====== Book Container ====== */
    .book {
      width: var(--page-width);
      min-height: var(--page-height);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 14px;
      border-radius: var(--card-radius);
      background: #273142;
      backdrop-filter: saturate(140%) blur(8px);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.25);
    }

    /* Header */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 6px;
      color: #fff;
      font-weight: 600;
    }
    .badge {
      padding: 5px 8px;
      border-radius: 999px;
      background: #111; color: #fff;
      letter-spacing: .5px; font-size: 11px;
    }

    /* Page (table) area */
    .page {
      display: grid;
      place-items: center;
      background: linear-gradient(90deg, rgba(0,0,0,.7) 50%, rgba(255,255,255,.8) 50%);
      border-radius: calc(var(--card-radius) - 4px);
      overflow: auto;
    }
    .page-inner {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr; /* side-by-side layout */
      gap: 12px; /* gap between cards */
    }

    /* Left / Right panes */
    .pane {
      display: grid; place-items: center;
      padding: 12px;
    }
    .pane.left  { color: #f7f7f7; }
    .pane.right { color: #111; }

    /* ===== Table Card ===== */
    .table-card {
      width: 90%; /* adjust card width here */
      max-width: 100%;
      border-radius: var(--card-radius);
      padding: 14px; /* adjust padding here */
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
    }
    .pane.right .table-card {
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.08);
    }

    .title {
      font-size: 22px; /* adjust title font size here */
      font-weight: 800;
      margin-bottom: 10px;
      letter-spacing: .5px;
    }
    .rows {
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
      font-size: 16px; /* adjust numbers font size here */
      white-space: pre; /* ensures numbers stay on same line */
    }

    /* Controls */
    .controls {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: 0;
      padding: 8px 12px;
      border-radius: 10px;
      background: #111; color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
      transition: transform .12s ease, opacity .2s ease;
    }
    .btn[disabled] { opacity: .4; cursor: not-allowed; }
    .btn:hover:not([disabled]) { transform: translateY(-1px); }
    .pager {
      font-weight: 700;
      letter-spacing: .4px;
      color: #111;
      background: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.08);
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      .topbar { color: #eee; }
      .pager  { background: rgba(255,255,255,.9); color:#111; }
    }

    /* ===== Mobile tweaks ===== */
    @media (max-width: 480px) {
      .table-card { width: 90%; } /* mobile card width */
      .title { font-size: 20px; } /* mobile title size */
      .rows { font-size: 14px; } /* mobile numbers font size */
    }
  a{color:#fff}button:focus-visible,a:focus-visible{outline:3px solid #ffcf70;outline-offset:4px}@media(max-width:560px){body{padding:18px 0}.page-inner{grid-template-columns:1fr}.page{background:#1a2230}.pane.right{background:#fafafa}.book{height:auto;min-height:0}.table-card{width:100%}.rows{white-space:pre-wrap}.controls{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){.btn{transition:none}}</style>
</head>
<body>
  <div class="book">
    <div class="topbar">
      <a href="../index.html">All demos</a><span class="badge">Tables Book</span>
      <span id="heading">Table of 1</span>
    </div>

    <div class="page">
      <div class="page-inner">
        <div class="pane left">
          <div class="table-card">
            <div class="title" id="leftTitle">Table of 1</div>
            <pre class="rows" id="leftRows"></pre>
          </div>
        </div>
        <div class="pane right">
          <div class="table-card">
            <div class="title" id="rightTitle">Table of 2</div>
            <pre class="rows" id="rightRows"></pre>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn">⟵ Prev</button>
      <div class="pager" id="pageIndicator" role="status" aria-live="polite">Page 1 / 50</div>
      <button class="btn" id="nextBtn">Next ⟶</button>
    </div>
  </div>

  <script>
    const MAX_TABLE = 100;
    const TOTAL_PAGES = Math.ceil(MAX_TABLE / 2);
    const heading = document.getElementById("heading");
    const pageIndicator = document.getElementById("pageIndicator");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    const leftTitle = document.getElementById("leftTitle");
    const leftRows = document.getElementById("leftRows");
    const rightTitle = document.getElementById("rightTitle");
    const rightRows = document.getElementById("rightRows");

    let current = 1;

    function makeTable(n){
      let s="";
      for(let i=1;i<=10;i++){
        s += `${n}*${i}=${n*i}\n`; // updated format 20*10=200
      }
      return s.trim();
    }

    function render(){
      const leftN = current * 2 - 1;
      const rightN = Math.min(leftN+1, MAX_TABLE);
      leftTitle.textContent = `Table of ${leftN}`;
      leftRows.textContent = makeTable(leftN);
      rightTitle.textContent = `Table of ${rightN}`;
      rightRows.textContent = makeTable(rightN);
      heading.textContent = `Tables ${leftN} and ${rightN}`;
      pageIndicator.textContent = `Page ${current} / ${TOTAL_PAGES}`;
      prevBtn.disabled = current===1;
      nextBtn.disabled = current>=TOTAL_PAGES;
    }

    prevBtn.addEventListener("click",()=>{if(current>1) current--;render();});
    nextBtn.addEventListener("click",()=>{if(current<TOTAL_PAGES) current++;render();});
    window.addEventListener("keydown",(e)=>{if(e.altKey||e.ctrlKey||e.metaKey||["INPUT","TEXTAREA","SELECT"].includes(e.target?.tagName))return;if(e.key==="ArrowRight"){e.preventDefault();nextBtn.click();}if(e.key==="ArrowLeft"){e.preventDefault();prevBtn.click();}});
    render();
  </script>
</body>
</html>
